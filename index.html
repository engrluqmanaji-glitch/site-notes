<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Notes – Masirah WWN</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14324d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Site Notes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#16202a;--mut:#5d6b78;--line:#dde3e8;--pri:#14324d;--pri2:#1f4f7a;--acc:#e8a33d;
--open:#b7791f;--openbg:#fdf3e1;--ok:#2f7a3b;--okbg:#e6f3e7;--bad:#b42e2e;--badbg:#fbe6e6;--info:#1f5fa8;--infobg:#e4effa;--void:#777;--voidbg:#eee;
--r:10px;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:calc(10px + var(--safe-top)) 14px 10px}
header .row{display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:11.5px;opacity:.75;margin-top:2px}
.hbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.hbtn:active{background:rgba(255,255,255,.25)}
main{max-width:900px;margin:0 auto;padding:12px 12px calc(90px + var(--safe-bot))}
.zones{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none}
.zones::-webkit-scrollbar{display:none}
.zchip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.zchip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.zchip .n{font-size:11px;opacity:.8;margin-left:4px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:4px 0 12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 4px;text-align:center;cursor:pointer;user-select:none}
.stat b{display:block;font-size:20px;line-height:1.2}
.stat span{font-size:11.5px;color:var(--mut)}
.stat.on{outline:2px solid var(--pri2)}
@media(max-width:420px){.stats{grid-template-columns:repeat(3,1fr)}.stat:nth-child(n+4){}}
.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tools input[type=search]{flex:1;min-width:160px}
.fbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fbar select,.fbar input{font-size:13px;padding:6px 8px}
input,select,textarea{border:1px solid #c9d2da;border-radius:8px;padding:9px 10px;background:#fff;width:100%}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #7fb0dc;border-color:#7fb0dc}
.btn{border:1px solid #c9d2da;background:#fff;border-radius:8px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#1d1406;font-weight:600}
.btn.danger{color:var(--bad);border-color:#e3b4b4}
.btn.sm{padding:6px 10px;font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.rec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;display:flex;gap:10px}
.rec:active{background:#f7f9fb}
.rec .main{flex:1;min-width:0}
.rec .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.rec .no{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--mut)}
.rec .t{font-weight:600;margin:2px 0}
.rec .m{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;background:#e9eef2;flex:0 0 64px}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:12px;white-space:nowrap;font-weight:600}
.b-open{background:var(--openbg);color:var(--open)}.b-closed{background:var(--okbg);color:var(--ok)}
.b-bad{background:var(--badbg);color:var(--bad)}.b-info{background:var(--infobg);color:var(--info)}.b-void{background:var(--voidbg);color:var(--void)}
.b-minor{background:#fff1d6;color:#8a5a00}.b-ok{background:var(--okbg);color:var(--ok)}
.overdue{color:var(--bad);font-weight:600}
.fab{position:fixed;right:16px;bottom:calc(18px + var(--safe-bot));z-index:30;display:flex;gap:8px}
.fab .btn{box-shadow:0 4px 14px rgba(0,0,0,.18);border-radius:28px;padding:13px 18px;font-weight:600}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--pri)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px;font-weight:600}
.fld label .req{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #c9d2da;background:#fff;border-radius:18px;padding:6px 11px;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chip.t-bad.on{background:var(--bad);border-color:var(--bad)}
.chip.t-info.on{background:var(--info);border-color:var(--info)}
.chip.t-ok.on{background:var(--ok);border-color:var(--ok)}
.chip.t-minor.on{background:#c98300;border-color:#c98300}
.err{color:var(--bad);font-size:12.5px;margin-top:4px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.ph{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fafbfc;position:relative}
.ph img{width:100%;height:100px;object-fit:cover;display:block;background:#e9eef2}
.ph .cap{padding:5px}
.ph .cap input{font-size:12px;padding:5px 6px}
.ph .cap select{font-size:12px;padding:4px 6px;margin-top:4px}
.ph .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:14px;width:26px;height:26px;cursor:pointer}
.ph .tag{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:1px 6px;border-radius:8px}
.addph{border:2px dashed #b9c4ce;border-radius:8px;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);cursor:pointer;font-size:13px;gap:4px;background:#fff}
.dl{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;font-size:14px}
.dl dt{color:var(--mut)}.dl dd{margin:0;white-space:pre-wrap;word-break:break-word}
@media(max-width:420px){.dl{grid-template-columns:105px 1fr}}
.steps{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin:6px 0}
.step{font-size:12px;padding:3px 9px;border-radius:12px;border:1px solid var(--line);color:var(--mut)}
.step.done{background:var(--okbg);color:var(--ok);border-color:#bfe0c3}
.step.cur{background:var(--pri);color:#fff;border-color:var(--pri)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.gal figure{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.gal img{width:100%;height:130px;object-fit:cover;display:block;cursor:zoom-in;background:#e9eef2}
.gal figcaption{font-size:12px;padding:5px 7px;color:var(--mut)}
.hist{font-size:12.5px;color:var(--mut);border-left:2px solid var(--line);padding-left:10px}
.hist div{margin-bottom:4px}
.modal{position:fixed;inset:0;background:rgba(10,20,30,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:#fff;border-radius:14px;max-width:440px;width:100%;padding:18px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 10px}
.lightbox{position:fixed;inset:0;background:#000;z-index:60;display:flex;align-items:center;justify-content:center}
.lightbox img{max-width:100%;max-height:100%}
.lightbox button{position:absolute;top:calc(12px + var(--safe-top));right:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--safe-bot));background:#16202a;color:#fff;padding:10px 16px;border-radius:10px;z-index:70;font-size:14px;max-width:90vw}
.banner{background:#fff6e0;border:1px solid #f0d58a;color:#6b4b00;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13.5px}
.zsum{width:100%;border-collapse:collapse;font-size:13px}
.zsum th,.zsum td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:center}
.zsum th:first-child,.zsum td:first-child{text-align:left}
.zsum tr{cursor:pointer}
.formbar{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + var(--safe-bot));display:flex;gap:8px;z-index:10}
.formbar .btn{flex:1;padding:12px}
.muted{color:var(--mut)}
.small{font-size:12.5px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{text-align:center;font-size:11.5px;color:var(--mut);margin-top:18px}
.hidden{display:none!important}

/* ---- app shell redesign ---- */
header{padding:calc(12px + var(--safe-top)) 14px 12px}
header .ttl{flex:1;min-width:0}
header h1{font-size:18px;font-weight:700}
header .sub{font-size:11.5px}
.hbtn.icon{width:38px;height:38px;padding:0;justify-content:center}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.ic.sm{width:16px;height:16px}.ic.lg{width:26px;height:26px}
.zpick{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--pri);border:0;border-radius:20px;padding:7px 12px;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
main{padding:14px 14px calc(96px + var(--safe-bot))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-around;padding:6px 6px calc(6px + var(--safe-bot));box-shadow:0 -4px 16px rgba(20,50,77,.06)}
.tabbar button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:#8695a2;padding:4px 0;cursor:pointer}
.tabbar button.on{color:var(--pri);font-weight:700}
.tabbar .tnew{flex:0 0 64px;height:56px;margin-top:-26px;border-radius:18px;background:var(--acc);color:#1d1406;box-shadow:0 6px 16px rgba(232,163,61,.45);justify-content:center}
.tabbar .tnew .ic{width:28px;height:28px;stroke-width:2.4}
.hero{background:var(--pri);color:#fff;border-radius:18px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero .d{font-size:12.5px;opacity:.75}
.hero .g{font-size:21px;font-weight:700;margin:2px 0 10px}
.hero .row2{display:flex;gap:18px;font-size:12.5px}
.hero .row2 b{display:block;font-size:20px;line-height:1.2}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left}
.kpi:active{background:#f7f9fb}
.kpi .ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 42px}
.kpi b{display:block;font-size:24px;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--mut)}
.subline{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:16px}
.sect{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px}
.sect h2{font-size:15px;margin:0;color:var(--ink)}
.sect a,.sect button{font-size:13px;color:var(--pri2);background:none;border:0;cursor:pointer;display:flex;align-items:center;gap:2px;padding:0}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;position:relative}
.qa button .ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.qa .cnt{position:absolute;top:6px;right:8px;background:var(--bad);color:#fff;font-size:11px;border-radius:10px;padding:0 6px;font-weight:700}
.ztiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zt{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left}
.zt.on{border-color:var(--pri2);box-shadow:0 0 0 2px rgba(31,79,122,.15)}
.zt .zc{display:flex;justify-content:space-between;align-items:center}
.zt .zc b{font-size:17px}
.zt .zm{font-size:12px;color:var(--mut);margin:4px 0 8px}
.bar{height:6px;border-radius:4px;background:#edf1f4;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.rrow{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px;margin-bottom:8px;cursor:pointer}
.rrow img,.rrow .noimg{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:0 0 48px;background:#e9eef2;display:flex;align-items:center;justify-content:center;color:#9aa7b2}
.rrow .mn{flex:1;min-width:0}
.rrow .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .m{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.seg button .n{opacity:.7;margin-left:4px;font-size:12px}
.sheet{position:fixed;inset:0;background:rgba(10,20,30,.5);z-index:55;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:10px 14px calc(16px + var(--safe-bot));max-height:80vh;overflow:auto}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:#d3dbe2;margin:2px auto 10px}
.sheet .opt{display:flex;justify-content:space-between;align-items:center;padding:13px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
.sheet .opt.on{color:var(--pri);font-weight:700}
.rec{border-radius:14px}
.card{border-radius:14px}
</style>
</head>
<body>
<header>
  <div class="row">
    <button class="hbtn icon hidden" id="backBtn" aria-label="Back"></button>
    <div class="ttl"><h1 id="title">Site Notes</h1><div class="sub" id="subtitle">Masirah WWN · Pkg 1A, 1B &amp; 1C</div></div>
    <button class="zpick" id="zoneBtn" aria-label="Choose zone"></button>
  </div>
</header>
<main id="view"><div class="empty"><span class="spin"></span> Loading…</div></main>
<nav class="tabbar" id="tabbar">
  <button data-tab="home"></button>
  <button data-tab="list"></button>
  <button class="tnew" id="newBtn" aria-label="New record"></button>
  <button data-tab="reports"></button>
  <button data-tab="settings"></button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
<script>
(() => {
"use strict";
const PROJECT_DEFAULT = "Wastewater Network System (Package 1A, 1B & 1C)\nMasirah Island, Sultanate of Oman";
const DEFAULTS = {
  zones: ["1A-1","1A-2","1B-1","1B-2","1B-3","1B-4","1C-1","1C-2"],
  components: ["BPC","HCC","Manhole","Pipeline","Other"],
  activities: ["Setting out","Excavation","Rock excavation","Shoring / trench support","Dewatering","Pipe laying","Chamber / MH construction","Encasement","Backfilling & compaction","Testing (air / water / CCTV)","Reinstatement","Utilities damage","Traffic management / HSE","Completion / handover"],
  responsible: ["Contractor","Subcontractor","Utility owner","Client"],
  project: PROJECT_DEFAULT, company: "", assets: {}
};
const OBS = [
  {k:"Info",label:"Info (for record)",cls:"t-info",badge:"b-info"},
  {k:"Compliant",label:"Compliant",cls:"t-ok",badge:"b-ok"},
  {k:"Minor defect",label:"Minor defect",cls:"t-minor",badge:"b-minor"},
  {k:"Major defect",label:"Major defect",cls:"t-bad",badge:"b-bad"},
  {k:"Safety",label:"Safety",cls:"t-bad",badge:"b-bad"},
  {k:"Environmental",label:"Environmental",cls:"t-minor",badge:"b-minor"},
  {k:"Utility damage",label:"Utility damage",cls:"t-bad",badge:"b-bad"}
];
const DEFECT = k => !["Info","Compliant"].includes(k);
const FLOW = ["Open","Action by contractor","Re-inspected","Closed"];
const TAGS = ["Before","During","After"];

let db=null, assets=null, user=null, canWrite=true;
let settings = JSON.parse(JSON.stringify(DEFAULTS));
let notes = [];           // [{id, ...data}]
let loaded = false, loadNote = "";
let zone = "All";
let statFilter = "";
let filters = {q:"", comp:"", act:"", obs:"", from:"", to:""};
let route = {v:"home"};   // list | edit | detail | pc
let draft = null;         // record being edited
let pending = [];         // new photos {file, url, caption, tag, gps}

const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = (n,w=2)=>String(n).padStart(w,"0");
const today = () => { const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const nowTime = () => { const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const fmtDate = s => { if(!s) return ""; const [y,m,d]=s.split("-"); const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; return `${+d} ${M[+m-1]} ${y}`; };
let archive=null; let liveNotes=[]; let zipUrls={};
const urlCache={};
const blob = id => (id && String(id).startsWith("zip:")) ? (zipUrls[id.slice(4)]||"") : (urlCache[id]||"");
function toast(msg,ms=2600){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),ms); }
function lsGet(k,d){ try{ const v=localStorage.getItem("sn_"+k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem("sn_"+k, JSON.stringify(v)); }catch(e){} }

zone = lsGet("zone","All");

/* ---------- confirm / prompt dialogs ---------- */
function dialog({title, body="", input=null, ok="OK", cancel="Cancel", danger=false}){
  return new Promise(res=>{
    const m=document.createElement("div"); m.className="modal";
    m.innerHTML=`<div class="box"><h3>${esc(title)}</h3><div class="small muted" style="margin-bottom:10px">${body}</div>
      ${input!==null?`<textarea id="dlgIn" placeholder="${esc(input)}"></textarea><div class="err hidden" id="dlgErr">Enter a reason first</div>`:""}
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
      ${cancel?`<button class="btn" data-a="c">${esc(cancel)}</button>`:""}<button class="btn ${danger?"danger":"pri"}" data-a="o">${esc(ok)}</button></div></div>`;
    document.body.appendChild(m);
    m.addEventListener("click",e=>{
      const a=e.target.dataset.a; if(!a) return;
      if(a==="o" && input!==null){ const v=$("#dlgIn",m).value.trim(); if(!v){ $("#dlgErr",m).classList.remove("hidden"); return; } m.remove(); res(v); return; }
      m.remove(); res(a==="o"? true : null);
    });
  });
}

/* ---------- derived ---------- */
function isOverdue(n){ return n.status && !["Closed","Info","Void"].includes(n.status) && n.dueDate && n.dueDate < today(); }
function statusBadge(n){
  if(n.status==="Void") return `<span class="badge b-void">Void</span>`;
  if(n.status==="Info") return `<span class="badge b-info">Info</span>`;
  if(n.status==="Closed") return `<span class="badge b-closed">Closed</span>`;
  return `<span class="badge b-open">${esc(n.status||"Open")}</span>`;
}
function obsBadge(n){ const o=OBS.find(x=>x.k===n.obsType); return o && n.obsType!=="Info" ? `<span class="badge ${o.badge}">${esc(n.obsType)}</span>`:""; }
function where(n){ return [n.zone, n.plot && ("Plot/Line "+n.plot), n.asset].filter(Boolean).join(" · "); }
function headline(n){
  const comp = n.component==="Other" ? (n.componentOther||"Other") : n.component;
  const what = n.component==="Pipeline" && (n.from||n.to) ? `Pipeline ${n.from||"?"} → ${n.to||"?"}` : (n.asset || comp || "");
  return [what, n.activity].filter(Boolean).join(" · ");
}

function zoneNotes(z){ return notes.filter(n=> z==="All" || n.zone===z); }
function counts(list){
  const c={open:0,overdue:0,closed:0,ncr:0,info:0};
  for(const n of list){ if(n.status==="Void") continue;
    if(n.status==="Info") c.info++; else if(n.status==="Closed") c.closed++; else c.open++;
    if(isOverdue(n)) c.overdue++; if(n.ncrType && n.ncrType!=="None") c.ncr++; }
  return c;
}
function filtered(){
  let L = zoneNotes(zone);
  if(statFilter==="open") L=L.filter(n=>!["Closed","Info","Void"].includes(n.status));
  if(statFilter==="overdue") L=L.filter(isOverdue);
  if(statFilter==="closed") L=L.filter(n=>n.status==="Closed");
  if(statFilter==="ncr") L=L.filter(n=>n.ncrType && n.ncrType!=="None");
  if(statFilter==="info") L=L.filter(n=>n.status==="Info");
  if(statFilter!=="void") { if(!filters.showVoid) L=L.filter(n=>n.status!=="Void"); }
  const f=filters;
  if(f.comp) L=L.filter(n=>n.component===f.comp);
  if(f.act) L=L.filter(n=>n.activity===f.act);
  if(f.obs) L=L.filter(n=>n.obsType===f.obs);
  if(f.from) L=L.filter(n=>n.date>=f.from);
  if(f.to) L=L.filter(n=>n.date<=f.to);
  if(f.q){ const q=f.q.toLowerCase(); L=L.filter(n=>[n.no,n.zone,n.plot,n.asset,n.from,n.to,n.activity,n.component,n.componentOther,n.observation,n.rfi,n.ncrNo,n.drawing,n.actionRequired,n.responsible,(n.photos||[]).map(p=>p.caption).join(" ")].join(" ").toLowerCase().includes(q)); }
  return L.sort((a,b)=> (b.date+b.time+b.no).localeCompare(a.date+a.time+a.no));
}

function zoneSheet(){
  const m=document.createElement("div"); m.className="sheet";

  m.innerHTML=`<div class="box"><div class="grab"></div><div style="font-weight:700;font-size:16px;margin:0 6px 4px">Choose zone</div>`+

/* ---------- router ---------- */
function go(r){ route=r; window.scrollTo(0,0); render(); }
function render(){
  const tabView=["home","list","reports","settings"].includes(route.v);

  $("#tabbar").classList.toggle("hidden", !tabView);
  $("#newBtn").classList.toggle("hidden", !canWrite || !!archive);
  document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("on", b.dataset.tab===route.v));
  const zb=$("#zoneBtn"); zb.classList.toggle("hidden", !(route.v==="home"||route.v==="list"));
  zb.innerHTML=ic("pin","sm")+`<span>${esc(zone==="All"?"All zones":zone)}</span>`+ic("down","sm");
  $("#subtitle").textContent = archive ? "Old records from PC · read-only" : "Masirah WWN · Pkg 1A, 1B & 1C";
  if(route.v==="home") return renderHome();
  if(route.v==="list") return renderList();
  if(route.v==="edit") return renderEdit();
  if(route.v==="detail") return renderDetail();
  if(route.v==="reports") return renderReports();
  if(route.v==="settings") return renderPC();
}

function locHtml(){
  const g=draft&&draft.gps;

  if(g) return `${ic("pin","sm")}<span><b>${g.lat.toFixed(6)}, ${g.lng.toFixed(6)}</b>${g.acc?` <span class="muted">(±${Math.round(g.acc)} m)</span>`:""}${g.src==="photo"?` <span class="muted">from photo</span>`:""}</span><button type="button" class="btn sm" id="locRef" style="margin-left:auto">Refresh</button>`;
  if(locState==="denied") return `${ic("pin","sm")}<span>Location is blocked. Allow location for this app in your phone settings.</span><button type="button" class="btn sm" id="locRef" style="margin-left:auto">Try again</button>`;
  if(locState==="fail") return `${ic("pin","sm")}<span>Couldn't get location. Turn on GPS and try again.</span><button type="button" class="btn sm" id="locRef" style="margin-left:auto">Try again</button>`;

function getLocation(force){
  if(!("geolocation" in navigator)){ locState="fail"; return; }

  locState="busy"; const l=$("#locLine"); if(l){ l.innerHTML=locHtml(); bindLoc(); }
  navigator.geolocation.getCurrentPosition(p=>{
    if(!draft) return;
    draft.gps={lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy, src:"device"}; locState="ok";
    const l=$("#locLine"); if(l){ l.innerHTML=locHtml(); bindLoc(); }
  }, e=>{ locState = e.code===1 ? "denied" : "fail"; const l=$("#locLine"); if(l){ l.innerHTML=locHtml(); bindLoc(); } },
  {enableHighAccuracy:true, timeout:20000, maximumAge:30000});

async function readGps(file){
  try{ if(!window.exifr) return null; const g=await exifr.gps(file); if(g && isFinite(g.latitude) && isFinite(g.longitude)) return {lat:g.latitude,lng:g.longitude}; }catch(e){}
  return null;
}
async function addFiles(files){
  collect();
  for(const f of files){
    if(!f.type.startsWith("image/")) continue;
    const gps=await readGps(f);
    const defTag = draft.status==="Re-inspected"||draft.status==="Action by contractor" ? "After" : "Before";
    pending.push({file:f, url:URL.createObjectURL(f), caption:"", tag:defTag, gps});
    if(gps && !draft.gps){ draft.gps={...gps, src:"photo"}; }
  }
  $("#phIn").value="";
  renderPhotos();
  if(route.v==="edit"){ const l=$("#locLine"); if(l){ l.innerHTML=locHtml(); bindLoc(); } }
}
function shrink(file,max=1600,q=0.82){
  return new Promise((res,rej)=>{
    const img=new Image(); const u=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",q); };
    img.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error("decode")); };
    img.src=u;
  });
}
async function uploadOnce(b,type){
  try{ return await assets.upload(b, type?{type}:undefined); }
  catch(e){ if(e && e.code==="store_unavailable"){ await new Promise(r=>setTimeout(r,1200)); return await assets.upload(b, type?{type}:undefined); } throw e; }
}
function validate(){
  const errs=[]; const d=draft;
  if(!d.zone) errs.push("zone"); if(!d.plot) errs.push("plot"); if(!d.component) errs.push("component"); if(!d.activity) errs.push("activity"); if(!d.obsType) errs.push("obsType");
  if(d.obsType && DEFECT(d.obsType) && (d.photos.length+pending.length)===0) errs.push("photos");
  document.querySelectorAll("[data-err]").forEach(e=>e.classList.toggle("hidden", !errs.includes(e.dataset.err)));
  if(errs.length){ const first=document.querySelector(`[data-err="${errs[0]}"]`); first && first.scrollIntoView({behavior:"smooth",block:"center"}); }
  return !errs.length;
}
async function nextNumber(){
  const ref=db.doc("meta/counter"); const yr=new Date().getFullYear();
  const snap=await ref.get(); let seq=1;
  if(snap.exists){ const v=snap.data(); seq = (v.year===yr ? (v.seq||0) : 0) + 1; }
  // guard against existing numbers (e.g. two devices)
  const used=new Set(notes.map(n=>n.no));
  let no; do { no=`SN-${yr}-${pad(seq,5)}`; if(used.has(no)) seq++; else break; } while(true);
  await ref.set({year:yr, seq});
  return no;
}
let saving=false;
async function saveDraft(){
  if(saving) return; collect();
  if(!validate()) return;
  if(pending.length && !assets){ toast("Photo upload isn't available in this view."); return; }
  saving=true; const btn=$("#saveE"); btn.innerHTML='<span class="spin"></span> Saving…'; btn.disabled=true;
  try{
    const d=draft; const isNew=!route.id;
    for(let i=0;i<pending.length;i++){
      btn.innerHTML=`<span class="spin"></span> Uploading photo ${i+1}/${pending.length}…`;
      const p=pending[i];
      let orig=null, prev=null;
      const okType=["image/jpeg","image/png","image/webp","image/gif"].includes(p.file.type);
      if(okType && p.file.size<=20*1024*1024){ orig=(await uploadOnce(p.file)).id; }
      const small=await shrink(p.file); prev=(await uploadOnce(small,"image/jpeg")).id;
      if(!orig) orig=prev;
      d.photos.push({orig, prev, caption:p.caption||"", tag:p.tag||"Before", gps:p.gps||null, name:p.file.name||"", addedAt:new Date().toISOString()});
    }
    const removed=d._removed||[]; delete d._removed;
    const stamp=new Date().toISOString();
    if(isNew){
      d.no=await nextNumber(); d.createdAt=stamp; d.status = d.obsType==="Info"?"Info":(DEFECT(d.obsType)?"Open":"Closed");
      if(d.obsType==="Compliant"){ d.status="Closed"; d.closedDate=today(); d.actionTaken=d.actionTaken||"Compliant – no action required"; }
      d.history=[{at:stamp, what:"Created"}];
      const ref=db.collection("notes").doc(); d.id=ref.id; const body={...d}; delete body.id;
      await ref.set(body);
      lsSet("last",{zone:d.zone,plot:d.plot,asset:d.asset,component:d.component,componentOther:d.componentOther,activity:d.activity,from:d.from,to:d.to,rfi:d.rfi});
      for(const p of removed){ try{ await assets.delete(p.orig); if(p.prev!==p.orig) await assets.delete(p.prev);}catch(e){} }
      pending=[]; saving=false; toast("Saved "+d.no); go({v:"detail",id:d.id});
    } else {
      const old=notes.find(x=>x.id===route.id)||{};
      const changed=Object.keys(d).filter(k=>!["history","photos","id"].includes(k) && JSON.stringify(d[k]??"")!==JSON.stringify(old[k]??""));
      if(pending.length) changed.push(`${pending.length} photo(s) added`);
      if(removed.length) changed.push(`${removed.length} photo(s) removed`);
      d.history=(d.history||[]).concat(changed.length?[{at:stamp, what:"Edited: "+changed.join(", ")}]:[]);
      if(d.obsType==="Info" && d.status!=="Void") d.status="Info";
      else if(DEFECT(d.obsType) && ["Info"].includes(d.status)) d.status="Open";
      const body={...d}; delete body.id;
      await db.collection("notes").doc(route.id).set(body);
      for(const p of removed){ try{ await assets.delete(p.orig); if(p.prev && p.prev!==p.orig) await assets.delete(p.prev);}catch(e){} }
      pending=[]; saving=false; toast("Saved"); go({v:"detail",id:route.id});
    }
  }catch(e){
    saving=false; btn.disabled=false; btn.textContent="Save record";
    const code=e&&e.code;
    toast(code==="quota_exceeded"||code==="quota_or_state" ? "Phone storage is full. Send to PC and remove old records." : code==="too_large" ? "A photo is too large." : "Couldn't save. Try again.",4000);
    console.error(e);
  }
}

const libP={};
function loadLib(url,check){ if(check()) return Promise.resolve(); if(!libP[url]) libP[url]=new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=url; s.onload=res; s.onerror=()=>{ delete libP[url]; rej(new Error(url)); }; document.head.appendChild(s); }); return libP[url]; }

function rowOf(n){ return [n.no,n.date,n.time,n.zone,n.plot,compName(n),n.asset,n.from,n.to,n.activity,n.obsType,n.severity,n.observation,n.status,n.actionRequired,n.responsible,n.dueDate,isOverdue(n)?"Yes":"",n.ncrType&&n.ncrType!=="None"?ncrLabel(n):"",n.rfi,n.drawing,n.itp,n.contractorRep,n.weather,n.ground,n.measurements,n.actionTaken,n.verifiedBy,n.closedDate,n.voidReason,n.gps?n.gps.lat:"",n.gps?n.gps.lng:"",n.gps?`https://www.google.com/maps?q=${n.gps.lat},${n.gps.lng}`:(n.mapLink||""),(n.photos||[]).length,(n.photos||[]).map(p=>p.file||"").filter(Boolean).join("; "),(n.createdAt||"").replace("T"," ").slice(0,16),lastChange(n).replace("T"," ").slice(0,16)].map(v=>v??""); }
function workbook(list){

  ws["!cols"]=COLS.map(c=>({wch:["Observation","Action required","Action taken","Measurements","Photo files","Map link"].includes(c)?40:Math.max(10,c.length+2)}));
  ws["!autofilter"]={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:sorted.length,c:COLS.length-1}})}; ws["!freeze"]={xSplit:1,ySplit:1};

  const zs=[["Zone","Open","Overdue","Closed","NCR / SOR","Info","Void","Total"]];
  const zones=[...new Set([...settings.zones,...list.map(n=>n.zone).filter(Boolean)])];
  for(const z of zones){ const L=list.filter(n=>n.zone===z); const c=counts(L); zs.push([z,c.open,c.overdue,c.closed,c.ncr,c.info,L.filter(n=>n.status==="Void").length,L.length]); }

  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(zs),"Zone summary");
  const ncr=[["Record No","NCR / SOR","Date","Zone","Plot / Line","Asset / From-To","Activity","Observation","Responsible","Target date","Status","Closed date"]];

function setProg(t){ const e=$("#tProg"); if(e) e.innerHTML=t; }
async function transfer(scope){
  const list = scope==="all" ? liveNotes.slice() : liveNotes.filter(needsTransfer);
  if(!list.length){ toast("Nothing new to send."); return; }
  try{ setProg('<span class="spin"></span> Loading tools…'); await Promise.all([loadZip(),loadXlsx()]); }catch(e){ setProg(""); toast("Couldn't load the export tools. Check your connection."); return; }
  const zip=new JSZip(); const recs=[]; let done=0, total=list.reduce((a,n)=>a+(n.photos||[]).length,0), failed=0;
  for(const n of list){
    const folder=`Records/${(n.zone||"No zone").replace(/[\\/:*?"<>|]/g,"-")}/${n.no}`;
    const r=JSON.parse(JSON.stringify(n)); delete r.id;
    for(let i=0;i<(r.photos||[]).length;i++){
      const p=r.photos[i]; setProg(`<span class="spin"></span> Photo ${++done} of ${total}…`);
      try{ const b=await getBlob(p.orig||p.prev);
        const ext=/png/.test(b.type)?"png":/webp/.test(b.type)?"webp":"jpg"; const fn=`${n.no}_${pad(i+1)}${p.tag?"_"+p.tag.toLowerCase():""}.${ext}`;

  zip.file("READ ME.txt", `Site Notes export ${stamp()}\n${settings.project}\n\nRecords: ${recs.length}\nPhotos: ${total-failed}${failed?` (${failed} could not be copied)`:""}\n\n- Site_Notes_Register.xlsx: register, zone summary, NCR/SOR register\n- Records\\<zone>\\<record no>\\: original photos and details\n- archive.json: keep this zip in D:\\SITE NOTES APP RECORD\\Archive. Open it in the app (PC / Settings > Open old records) to view these records with photos.\n`);
  setProg('<span class="spin"></span> Compressing…');
  const out=await zip.generateAsync({type:"blob",compression:"STORE"});

  const ok=await saveFile(`SiteNotes_${stamp()}.zip`, out);
  if(!ok) return;

  for(const n of list){ try{ const body={...n, transferredAt:at}; delete body.id; await db.collection("notes").doc(n.id).set(body); }catch(e){} }
  toast(`Sent ${list.length} record${list.length>1?"s":""}${failed?` (${failed} photo(s) failed)`:""}. Save the zip in D:\\SITE NOTES APP RECORD on your PC.`,6000);

}
async function cleanupOnline(){

async function openArchives(files){
  try{ await loadZip(); }catch(e){ toast("Couldn't load the zip tool. Check your connection."); return; }
  closeArchive(true);

    try{
      const z=await JSZip.loadAsync(f); const j=z.file("archive.json"); if(!j) { toast(f.name+" isn't a Site Notes archive."); continue; }
      const data=JSON.parse(await j.async("string")); names.push(f.name);
      for(const r of data.records||[]){
        for(const p of r.photos||[]){ if(p.file && z.file(p.file)){ const b=await z.file(p.file).async("blob"); const typ=p.file.endsWith(".png")?"image/png":"image/jpeg"; const key=f.name+"|"+p.file; zipUrls[key]=URL.createObjectURL(new Blob([b],{type:typ})); p.orig=p.prev="zip:"+key; } else { p.orig=p.prev="zip:missing"; } }

    const assetsMap={}; $("#s_assets").value.split("\n").forEach(l=>{ const i=l.indexOf(":"); if(i<1) return; const z=l.slice(0,i).trim(); const a=l.slice(i+1).split(/[,;]/).map(s=>s.trim()).filter(Boolean); if(a.length) assetsMap[z]=a; });
    settings={...settings, project:$("#s_project").value.trim()||PROJECT_DEFAULT, company:$("#s_company").value.trim(), zones, components:lines("#s_components"), activities:lines("#s_activities"), responsible:lines("#s_responsible"), assets:assetsMap};
    await saveSettings(); toast("Settings saved");
  };
}
async function saveSettings(){ if(!db) return; try{ await db.doc("settings/main").set(settings); }catch(e){ toast("Couldn't save settings."); } }

/* ---------- install card ---------- */
let installEvt=null; let updateReady=false; const APP_VERSION="1.2 (17 Nov 2026)";
const isStandalone=()=> (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone===true;
const isIOS=()=> /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); installEvt=e; if(route.v==="home") render(); });
window.addEventListener("appinstalled",()=>{ installEvt=null; lsSet("installDone",true); toast("App installed – open it from your home screen"); if(route.v==="home") render(); });
function installCard(){
  if(isStandalone() || lsGet("installHide",false) || lsGet("installDone",false)) return "";
  const ios=isIOS();
  return `<div class="card" id="instCard" style="display:flex;gap:12px;align-items:flex-start;border-color:#b5d4f4;background:#f3f8fd">
    <img src="icon-192.png" alt="" style="width:52px;height:52px;border-radius:12px;flex:0 0 52px">
    <div style="flex:1;min-width:0">
      <div style="font-weight:700">Install Site Notes</div>
      <div class="small muted" style="margin:2px 0 8px">Get an app icon on your home screen. Opens full screen and works offline at site.</div>
      ${ios?`<div class="small" style="line-height:1.6">1. Tap the <b>Share</b> button <span style="font-size:15px">&#x2B06;&#xFE0E;</span> at the bottom of Safari<br>2. Choose <b>Add to Home Screen</b>, then <b>Add</b></div>`
       : installEvt?`<button class="btn pri" id="instBtn">&#x2B07;&#xFE0E; Install app</button>`
       : `<div class="small" style="line-height:1.6">In Chrome, tap <b>&#8942;</b> (top right), then <b>Install app</b> or <b>Add to Home screen</b>.</div>`}
    </div>
    <button class="btn sm" id="instX" aria-label="Hide" style="padding:4px 9px">&#x2715;</button>
  </div>`;
}

/* ---------- on-phone storage (IndexedDB) ---------- */
const IDB={
  db:null,
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open("sitenotes",1); r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains("docs")) d.createObjectStore("docs"); if(!d.objectStoreNames.contains("files")) d.createObjectStore("files"); }; r.onsuccess=()=>{ IDB.db=r.result; res(); }; r.onerror=()=>rej(r.error); }); },
  run(store,mode,fn){ return new Promise((res,rej)=>{ const t=IDB.db.transaction(store,mode); const st=t.objectStore(store); let out; const q=fn(st); if(q) q.onsuccess=()=>{ out=q.result; }; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error||new Error("abort")); }); },
  get(st,k){ return IDB.run(st,"readonly",s=>s.get(k)); },
  put(st,k,v){ return IDB.run(st,"readwrite",s=>s.put(v,k)); },
  del(st,k){ return IDB.run(st,"readwrite",s=>s.delete(k)); },
  entries(st,prefix){ return new Promise((res,rej)=>{ const out=[]; const t=IDB.db.transaction(st,"readonly"); const q=t.objectStore(st).openCursor(); q.onsuccess=()=>{ const c=q.result; if(c){ if(!prefix||String(c.key).startsWith(prefix)) out.push([c.key,c.value]); c.continue(); } }; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); }); }
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const subs=[];
function snapOf(path,v){ return {id:path.split("/").pop(), exists:v!==undefined&&v!==null, data:()=>v, metadata:{fromCache:false,hasPendingWrites:false}}; }
async function fire(l){
  if(l.type==="doc"){ l.cb(snapOf(l.path, await IDB.get("docs",l.path))); return; }
  const depth=l.path.split("/").length+1;
  const rows=(await IDB.entries("docs",l.path+"/")).filter(([k])=>String(k).split("/").length===depth);
  l.cb({docs:rows.map(([k,v])=>snapOf(k,v)), size:rows.length, empty:!rows.length, metadata:{fromCache:false,hasPendingWrites:false}});
}
function notify(path){ subs.forEach(l=>{ if(l.type==="doc"? l.path===path : path.startsWith(l.path+"/")) fire(l); }); }
const localDb={
  doc(p){ return { id:p.split("/").pop(), path:p,
    async get(){ return snapOf(p, await IDB.get("docs",p)); },
    async set(d){ await IDB.put("docs",p,JSON.parse(JSON.stringify(d))); notify(p); },
    async delete(){ await IDB.del("docs",p); notify(p); },
    onSnapshot(cb){ const l={type:"doc",path:p,cb}; subs.push(l); fire(l); return ()=>{ const i=subs.indexOf(l); if(i>=0) subs.splice(i,1); }; } }; },
  collection(cp){ return { path:cp, doc(id){ return localDb.doc(cp+"/"+(id||uid())); },
    onSnapshot(cb){ const l={type:"col",path:cp,cb}; subs.push(l); fire(l); return ()=>{ const i=subs.indexOf(l); if(i>=0) subs.splice(i,1); }; } }; }
};
const localAssets={
  async upload(b){ const id=uid(); await IDB.put("files",id,b); urlCache[id]=URL.createObjectURL(b); return {id,url:urlCache[id],sizeBytes:b.size,contentType:b.type}; },
  async delete(id){ await IDB.del("files",id); if(urlCache[id]){ URL.revokeObjectURL(urlCache[id]); delete urlCache[id]; } return {deleted:true}; }
};
async function preloadPreviews(list){
  for(const n of list) for(const p of n.photos||[]){ const id=p.prev||p.orig; if(id && !urlCache[id] && !String(id).startsWith("zip:")){ try{ const b=await IDB.get("files",id); if(b) urlCache[id]=URL.createObjectURL(b); }catch(e){} } }
}
function unsentInfo(){ const L=liveNotes.filter(needsTransfer); const oldest=L.map(n=>n.createdAt||"").sort()[0]; return {count:L.length, oldest}; }

/* ---------- boot ---------- */
setupShell();
render();
(async()=>{
  try{
    if(!("indexedDB" in window)){ loaded=true; loadNote="This browser can't store records. Use Chrome (Android) or Safari (iPhone)."; render(); return; }
    await IDB.open();
    try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
    db=localDb; assets=localAssets; canWrite=true;
    db.doc("settings/main").onSnapshot(s=>{ if(s.exists){ settings={...DEFAULTS, ...s.data()}; if(route.v!=="edit") render(); } });
    db.collection("notes").onSnapshot(async s=>{
      liveNotes=s.docs.map(d=>({id:d.id, ...JSON.parse(JSON.stringify(d.data()))}));
      await preloadPreviews(liveNotes);
      if(!archive) notes=liveNotes;
      loaded=true; if(route.v!=="edit") render();
    });
  }catch(e){ console.error(e); loaded=true; loadNote="Couldn't open the app's storage. Close and reopen the app."; render(); }
})();
/* ---------- app updates ---------- */
let swReg=null;
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    swReg=reg;
    const ready=()=>{ if(navigator.serviceWorker.controller){ updateReady=true; if(["home","list","reports","settings"].includes(route.v)) render(); } };
    if(reg.waiting) ready();
    reg.addEventListener("updatefound",()=>{ const w=reg.installing; if(w) w.addEventListener("statechange",()=>{ if(w.state==="installed") ready(); }); });
    setInterval(()=>reg.update().catch(()=>{}), 60*60*1000);
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") reg.update().catch(()=>{}); });
  }).catch(()=>{});
  let refreshing=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(refreshing) return; refreshing=true; location.reload(); });
}
function applyUpdate(){ if(swReg && swReg.waiting) swReg.waiting.postMessage("SKIP_WAITING"); else location.reload(); }
async function checkUpdate(){
  if(!swReg){ toast("Updates work once the app is opened from its web link."); return; }
  toast("Checking for updates…",1500);
  try{ await swReg.update(); }catch(e){ toast("Can't check now – no internet?"); return; }
  setTimeout(()=>{ if(updateReady || swReg.waiting || swReg.installing) { updateReady=!!swReg.waiting||updateReady; render(); if(!updateReady) toast("Downloading update…"); } else toast("You have the latest version ("+APP_VERSION+")"); },2500);
}
})();
